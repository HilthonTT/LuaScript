name: Release
on:
  push:
    tags: ["v*"]
  # Lets you rehearse the build without publishing anything.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # CGO_ENABLED=0 keeps the cross-compile toolchain-free: the default build
      # already compiles the headless `ui` stub, and `plugin` reports
      # supported = false without cgo.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/luascript-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/luascript
      - name: Package
        working-directory: dist
        run: |
          name="luascript-${{ matrix.goos }}-${{ matrix.goarch }}"
          cp ../LICENSE ../README.md .
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${name}.zip" "${name}${{ matrix.ext }}" LICENSE README.md
          else
            tar czf "${name}.tar.gz" "${name}" LICENSE README.md
          fi
          rm -f LICENSE README.md "${name}${{ matrix.ext }}"
          sha256sum * > "${name}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
  release:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true